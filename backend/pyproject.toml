[project]
name = "fretflow-backend"
version = "0.1.0"
description = "FretFlow Guitar Karaoke Backend — Hybrid YouTube Search, Synced Lyrics Waterfall, Dual-Mode Audio Chord Recognition & Smart Capo Engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.13.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "torch>=2.4.0",
    "ytmusicapi>=1.8.0",
    "yt-dlp>=2025.1.0",
    "syncedlyrics>=1.0.1",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
